openapi: 3.0.3
info:
  title: RoleMesh API（由前端 demo 反推）
  version: 0.1.0
  description: >
    本文件由前端 mock 数据与写操作反推而来，非后端既有定义。
    字段名以前端为准；带 `x-frontend-guessed: true` 的字段是前端 AI 自作主张补的，
    后端需逐条判断"按此实现 / 改名 / 丢弃"，不要默认照做。
    path 为建议路径，前端未约定，可自由调整。
servers:
  - url: /api/v1
paths:
  # ===== 鉴权（新增：配合登录页） =====
  # 前端 index.html 里 authSendCode() / authSubmit() 目前是本地模拟（验证码写死 123456），
  # 接口就绪后只需把这两个函数体换成请求，其余渲染逻辑不用改。
  /auth/code:
    post:
      summary: 发送验证码（短信 / 邮件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, account]
              properties:
                mode: { type: string, enum: [phone, email] }
                account: { type: string, description: 11 位手机号或邮箱 }
      responses:
        '204': { description: 已发送（演示环境不真发，固定 123456） }
        '429': { description: 发送过于频繁（前端按钮 60s 倒计时） }
  /auth/login:
    post:
      summary: 验证码登录 / 未注册自动创建账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, account, code]
              properties:
                mode: { type: string, enum: [phone, email] }
                account: { type: string }
                code: { type: string, description: 6 位数字 }
                agreed: { type: boolean, description: 是否勾选用户协议（前端已强制校验）, x-frontend-guessed: true }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { description: 验证码错误或已过期 }
  /auth/logout:
    post:
      summary: 退出登录
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 已退出 }
  /auth/me:
    get:
      summary: 当前登录用户
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { description: 未登录 }
  /projects:
    get:
      summary: 项目浏览/推荐列表
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 关键词（匹配 name/type/domains/mode/desc/gaps/skills）
        - name: mode
          in: query
          schema: { type: array, items: { type: string } }
        - name: role
          in: query
          schema: { type: array, items: { type: string } }
          description: 所需角色（任一 gaps 命中）
        - name: domain
          in: query
          schema: { type: array, items: { type: string } }
          description: 领域方向（多值，任一命中 domains 即可）；原 sponsor 参数已废弃，发起方语义并入 type
        - name: sort
          in: query
          schema: { type: string, enum: [match, hot] }
          description: match=匹配度降序（默认），hot=热门优先
      responses:
        '200':
          description: Project 列表（⚠️ 前端无分页，后端需补）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
    post:
      summary: 发布项目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
  /projects/{id}:
    get:
      summary: 项目详情（⚠️ 前端复用列表项，未单独调用）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Project 全量（含 roles 明细、reasons）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
    put:
      summary: 编辑项目
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: 更新后的 Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
  /talents:
    get:
      summary: 推荐人才列表
      responses:
        '200':
          description: Talent 列表（⚠️ 无分页）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Talent' }
  /talents/{id}:
    get:
      summary: 人才画像详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Talent 全量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Talent' }
  /me/projects/owned:
    get:
      summary: 我发起的项目
      responses:
        '200':
          description: Project 列表（⚠️ 无分页）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
  /me/projects/joined:
    get:
      summary: 我参与的项目
      responses:
        '200':
          description: Project 列表（⚠️ 无分页）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
  /me/profiles:
    get:
      summary: 我的 Talent Profile 列表
      responses:
        '200':
          description: Profile 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TalentProfile' }
    post:
      summary: 创建/覆盖 Talent Profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TalentProfile' }
      responses:
        '200':
          description: 保存后的 Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TalentProfile' }
  /me:
    put:
      summary: 保存基础资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, major, grade]
              properties:
                name: { type: string }
                major: { type: string, description: 专业/院系 }
                grade: { type: string, description: 年级，如 2023 级 }
                avatar:
                  type: string
                  description: ⚠️ 前端存 dataURL，后端应改为文件上传返回 URL
                  x-frontend-guessed: true
      responses:
        '200': { description: 更新成功 }
  /me/applications:
    get:
      summary: 我的申请
      responses:
        '200':
          description: Application 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
  /me/invitations:
    get:
      summary: 我收到的邀请
      responses:
        '200':
          description: Invitation 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
  /me/dynamics:
    get:
      summary: 总动态
      responses:
        '200':
          description: Dynamic 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dynamic' }
  /me/summary:
    get:
      summary: 我的聚合统计
      responses:
        '200':
          description: 各数字卡数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeSummary' }
  /projects/{id}/applications:
    get:
      summary: 我收到的申请（按项目）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ReceivedApplication 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReceivedApplication' }
    post:
      summary: 申请加入项目
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, profile]
              properties:
                role:
                  type: string
                  description: 角色名
                profile:
                  type: string
                  description: ⚠️ 前端传画像 name，应传 profileId
                  x-frontend-guessed: true
                extra: { type: string, description: 附言 }
      responses:
        '201':
          description: 新建 Application（后端须返回真实 id）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
  /applications/{id}:
    delete:
      summary: 撤回申请
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已撤回 }
  /applications/{id}/agree:
    post:
      summary: 同意申请（触发入队）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已同意 }
  /applications/{id}/reject:
    post:
      summary: 拒绝申请
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已拒绝 }
  /invitations:
    post:
      summary: 邀请人才加入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [talent, project, role]
              properties:
                talent: { type: string, description: ⚠️ 前端传人才 name，应传 talentId, x-frontend-guessed: true }
                project: { type: string, description: ⚠️ 前端传项目 name，应传 projectId, x-frontend-guessed: true }
                role: { type: string }
      responses:
        '201':
          description: 新建 Invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
  /invitations/{id}:
    delete:
      summary: 撤销邀请
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已撤销 }
  /invitations/{id}/accept:
    post:
      summary: 接受邀请
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已接受 }
  /invitations/{id}/reject:
    post:
      summary: 拒绝邀请
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已拒绝 }
  /conversations:
    get:
      summary: 会话列表
      responses:
        '200':
          description: Conversation 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
    post:
      summary: 创建会话（私聊/群聊，按 type+name+project 去重）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, project]
              properties:
                type: { type: string, enum: [group, private] }
                name: { type: string }
                project: { type: string, description: ⚠️ 前端传项目 name, x-frontend-guessed: true }
      responses:
        '201':
          description: 返回会话 id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
  /conversations/{id}/messages:
    get:
      summary: 会话消息
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Message 列表（⚠️ 无分页，后端需补）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
    post:
      summary: 发送消息
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '201':
          description: 新建 Message（后端须补 id + 服务端时间戳）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /projects/{id}/activities:
    get:
      summary: 项目动态
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Activity 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    AuthSession:
      type: object
      properties:
        token: { type: string, description: 前端存入 sessionStorage 的 rm.session，刷新靠它恢复登录态 }
        userId: { type: string, x-frontend-guessed: true }
        mode: { type: string, enum: [phone, email] }
        account: { type: string, description: 已脱敏，如 138****8888 }
        nick: { type: string, description: 前端展示名：手机号 = Mesher+后4位，邮箱 = 前缀首字母大写, x-frontend-guessed: true }
    Project:
      type: object
      properties:
        id:
          type: string
          description: ⚠️ 前端无 id，用 name 关联；后端必须补
          x-frontend-guessed: true
        name: { type: string }
        type:
          type: string
          enum: [校园活动, 科创项目, 企业合作, 学科竞赛, 公益实践, 创业孵化, 其他]
          description: 项目类型（发起方维度），单选必填，决定卡片配色与分类标识
        domains:
          type: array
          items: { type: string }
          description: 领域方向（项目在做什么），多选必填；前端缺省时按 skills/desc 派生
          x-frontend-guessed: true
        mode:
          type: string
          description: 混合模式/线下团队/线上协作
          x-frontend-guessed: true
        stage: { type: string, enum: [idea, recruit, doing, sprint, done, teaming, full] }
        stageText:
          type: string
          description: 中文文案，与 stage 冗余
          x-frontend-guessed: true
        desc: { type: string }
        gaps:
          type: array
          items: { type: string }
        urgent:
          type: string
          x-frontend-guessed: true
        skills:
          type: array
          items: { type: string }
        time:
          type: string
          description: 自由文本，如 2-4小时/周
          x-frontend-guessed: true
        count: { type: integer }
        roleDuty:
          type: string
          x-frontend-guessed: true
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        vibe:
          type: string
          x-frontend-guessed: true
        match:
          type: integer
          description: 匹配度 0-100，前端自定口径
          x-frontend-guessed: true
        hot:
          type: boolean
          x-frontend-guessed: true
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        matchRoles:
          type: array
          x-frontend-guessed: true
          items:
            type: object
            properties:
              name: { type: string }
              match: { type: integer }
              reasons:
                type: array
                items: { type: string }
        reasons:
          type: array
          x-frontend-guessed: true
          items: { $ref: '#/components/schemas/Reason' }
        teamFull:
          type: boolean
          x-frontend-guessed: true
        team:
          type: array
          x-frontend-guessed: true
          items:
            type: object
            properties:
              name: { type: string }
              role: { type: string }
              bio: { type: string }
              profile: { $ref: '#/components/schemas/TalentProfile' }
        joined:
          type: boolean
          x-frontend-guessed: true
        myRole:
          type: string
          x-frontend-guessed: true
    ProjectCreate:
      type: object
      required: [name, type, desc, roles]
      properties:
        name: { type: string }
        type: { type: string }
        mode:
          type: string
          description: ⚠️ 前端硬编码 '线上协作'
          x-frontend-guessed: true
        stage:
          type: string
          description: ⚠️ 前端硬编码 'teaming'
          x-frontend-guessed: true
        desc: { type: string }
        vibe: { type: string, x-frontend-guessed: true }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        stage: { type: string }
        desc: { type: string }
        vibe: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    Role:
      type: object
      properties:
        name: { type: string }
        bio: { type: string, x-frontend-guessed: true }
        duty: { type: string }
        skills:
          type: array
          items: { type: string }
        count: { type: integer }
        time: { type: string, x-frontend-guessed: true }
    Member:
      type: object
      properties:
        name: { type: string }
        bio: { type: string }
    Reason:
      type: object
      properties:
        label: { type: string }
        text: { type: string }
    Talent:
      type: object
      properties:
        id:
          type: string
          description: ⚠️ 前端无 id
          x-frontend-guessed: true
        name: { type: string }
        bio: { type: string }
        match: { type: integer, x-frontend-guessed: true }
        applied: { type: boolean }
        role: { type: string }
        profile: { $ref: '#/components/schemas/TalentProfile' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/Reason' }
    TalentProfile:
      type: object
      properties:
        name: { type: string, description: 画像名，如 我的主画像 }
        role:
          type: string
          description: ⚠️ 前端用 ' / ' 分隔的字符串，契约要求 string[]
          x-frontend-guessed: true
        skills:
          type: array
          items: { type: string }
        exp:
          type: string
          description: ⚠️ 整段文本，契约要求 object[]
          x-frontend-guessed: true
        field:
          type: string
          description: ⚠️ 字符串，契约要求 string[]
          x-frontend-guessed: true
        coop: { type: string }
        time: { type: string }
    Conversation:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [group, private] }
        name: { type: string }
        project: { type: string, x-frontend-guessed: true }
        members:
          type: array
          items: { type: string }
        bio: { type: string }
        role: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
    Message:
      type: object
      properties:
        id:
          type: string
          description: ⚠️ 前端无 id
          x-frontend-guessed: true
        from: { type: string, enum: [me, other] }
        name: { type: string }
        text: { type: string }
        time:
          type: string
          description: ⚠️ 前端本地 HH:mm；后端应返回 ISO 时间戳
          x-frontend-guessed: true
    Application:
      type: object
      properties:
        id: { type: string, description: ⚠️ 前端自造 app-<timestamp> }
        icon: { type: string, x-frontend-guessed: true }
        project: { type: string, x-frontend-guessed: true }
        title: { type: string, description: ⚠️ 含 HTML, x-frontend-guessed: true }
        time: { type: string, x-frontend-guessed: true }
        tag: { type: string, x-frontend-guessed: true }
        role: { type: string }
        profile: { type: string, x-frontend-guessed: true }
        status:
          type: string
          enum: [待查看, 已查看, 初筛通过, 面试, 已通过, 已加入]
          x-frontend-guessed: true
        extra: { type: string }
    Invitation:
      type: object
      properties:
        id: { type: string }
        icon: { type: string, x-frontend-guessed: true }
        title: { type: string, description: ⚠️ 含 HTML, x-frontend-guessed: true }
        time: { type: string, x-frontend-guessed: true }
        tag: { type: string, x-frontend-guessed: true }
        status:
          type: string
          enum: [待处理, 已接受, 已婉拒]
          x-frontend-guessed: true
        project: { type: string, x-frontend-guessed: true }
        role: { type: string }
    ReceivedApplication:
      type: object
      properties:
        id: { type: string }
        icon: { type: string, x-frontend-guessed: true }
        title: { type: string, description: ⚠️ 含 HTML, x-frontend-guessed: true }
        time: { type: string, x-frontend-guessed: true }
        tag: { type: string, x-frontend-guessed: true }
        status:
          type: string
          enum: [待处理, 已同意, 已拒绝]
          x-frontend-guessed: true
        applicant: { type: string, x-frontend-guessed: true }
        project: { type: string, x-frontend-guessed: true }
        role: { type: string }
    Dynamic:
      type: object
      properties:
        icon: { type: string, x-frontend-guessed: true }
        title: { type: string, description: ⚠️ 含 HTML, x-frontend-guessed: true }
        time: { type: string, x-frontend-guessed: true }
        tag: { type: string, x-frontend-guessed: true }
        project: { type: string, x-frontend-guessed: true }
    Activity:
      type: object
      properties:
        icon: { type: string }
